name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # The Claude Code CLI enables the plugin manifest checks in validate.sh; no login is needed.
      - run: npm install -g @anthropic-ai/claude-code
      - run: bash scripts/validate.sh
